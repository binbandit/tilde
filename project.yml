name: Tilde
options:
  bundleIdPrefix: dev.tilde
  deploymentTarget:
    macOS: "27.0"
  createIntermediateGroups: true
  developmentLanguage: en

packages:
  TildeKit:
    path: Packages/TildeKit

settings:
  base:
    SWIFT_VERSION: "6.0"
    MACOSX_DEPLOYMENT_TARGET: "27.0"
    DEVELOPMENT_TEAM: 43TJNHX42U
    CODE_SIGN_STYLE: Automatic
    ENABLE_HARDENED_RUNTIME: YES
    SWIFT_DEFAULT_ACTOR_ISOLATION: MainActor
    SWIFT_APPROACHABLE_CONCURRENCY: YES
    DEAD_CODE_STRIPPING: YES

targets:
  Tilde:
    type: application
    platform: macOS
    sources:
      - path: Tilde
        type: syncedFolder
    dependencies:
      - package: TildeKit
    postBuildScripts:
      - name: Embed retired terminal hook compatibility
        script: 'bash "$SRCROOT/scripts/build-terminal-hook-compat.sh"'
        basedOnDependencyAnalysis: false
    entitlements:
      path: Tilde/Tilde.entitlements
      properties:
        com.apple.security.device.audio-input: true
        com.apple.security.automation.apple-events: true
        com.apple.security.personal-information.calendars: true
    info:
      path: Tilde/Info.plist
      properties:
        CFBundleDisplayName: tilde
        CFBundleShortVersionString: "0.1.0"
        CFBundleVersion: "1"
        LSUIElement: true
        LSApplicationCategoryType: public.app-category.developer-tools
        NSMicrophoneUsageDescription: tilde listens while you hold the tilde key, so you can talk to it.
        NSSpeechRecognitionUsageDescription: tilde transcribes what you say on this Mac.
        NSAppleEventsUsageDescription: tilde opens your terminal and editor when you take over or try a job.
        NSCalendarsFullAccessUsageDescription: tilde reads your calendar to brief you on your day and connect your meetings to your work. It never changes events.
        NSRemindersFullAccessUsageDescription: tilde reads your reminders so it can mention what's due. It never changes them.
        NSHumanReadableCopyright: ""
        CFBundleURLTypes:
          - CFBundleURLName: dev.tilde.app
            CFBundleURLSchemes: [tilde]
    settings:
      base:
        PRODUCT_NAME: tilde
        PRODUCT_BUNDLE_IDENTIFIER: dev.tilde.app
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        GENERATE_INFOPLIST_FILE: NO

  # The app's pure logic, compiled straight from Tilde/ with no app host, so nothing launches.
  TildeTests:
    type: bundle.unit-test
    platform: macOS
    sources:
      - TildeTests
      # Only the files under test, grouped under TildeTests so Xcode shows one Tilde folder.
      - { path: Tilde/Inlet/Inlet.swift, group: TildeTests/Tilde }
      - { path: Tilde/Inlet/InletGeometry.swift, group: TildeTests/Tilde }
      - { path: Tilde/Inlet/InletMinimization.swift, group: TildeTests/Tilde }
      - { path: Tilde/Inlet/InletPlacement.swift, group: TildeTests/Tilde }
      - { path: Tilde/Inlet/InletPreferences.swift, group: TildeTests/Tilde }
      - { path: Tilde/Inlet/InletShape.swift, group: TildeTests/Tilde }
      - { path: Tilde/Inlet/Conversation/ConversationVisibility.swift, group: TildeTests/Tilde }
      - { path: Tilde/Perception/ContextCapture.swift, group: TildeTests/Tilde }
      - { path: Tilde/Perception/Coordinates.swift, group: TildeTests/Tilde }
      - { path: Tilde/Perception/Referent.swift, group: TildeTests/Tilde }
      - { path: Tilde/Perception/Shells.swift, group: TildeTests/Tilde }
    dependencies:
      - package: TildeKit
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
